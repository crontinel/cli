name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded pull request checks without interrupting main branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify compilation
        run: go build ./...

      - name: Run tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...
