name: Dependabot (Go)

# Keep the legacy dependency diagnostic available on demand.
# Scheduled maintenance should produce actionable updates before being restored.
on:
  workflow_dispatch:

jobs:
  dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Run Go Dependabot
        uses: ahmadnassri/go-dependabot-action@v2
        with:
          package: .

