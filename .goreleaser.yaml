projectName: crontinel
env:
  - GoVersion=1.26
builds:
  - id: crontinel
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    main: .
    binary: crontinel
    ldflags:
      - -s -w
archives:
  - id: default
    format: tar.gz
    files:
      - README.md
checksum:
  name_template: 'checksums.txt'
brews:
  - name: crontinel
    repository:
      owner: crontinel
      name: homebrew-tap
    directory: Formula
    homepage: https://crontinel.com
    description: CLI tool for Crontinel background job monitoring
    test: |
      system "#{bin}/crontinel", "--help"
    install: |
      bin.install "crontinel"
release:
  github:
    owner: crontinel
    name: cli
